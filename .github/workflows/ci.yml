name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lmodulo/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/lmodulo/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  typecheck-frontend:
    name: Frontend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lmodulo/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/lmodulo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx svelte-kit sync && npx tsc --noEmit
