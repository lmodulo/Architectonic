services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - ORIGIN=http://localhost:${WEB_PORT:-3000}
      - API_URL=http://api:4000
      # adapter-node rejects request bodies over 512K by default; match the API's 10 MB upload limit
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-10M}
      # Shared with the api service: lets the API rate-limit each visitor instead of the web server as a whole
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      - HOST=0.0.0.0
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/${MONGO_DB:-appdb}
      - SESSION_SECRET=${SESSION_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - FRONTEND_ORIGIN=http://localhost:${WEB_PORT:-3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Architectonic <noreply@example.com>}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - AWS_BUCKET=${AWS_BUCKET:-uploads}
      - AWS_REGION=${AWS_REGION:-auto}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
